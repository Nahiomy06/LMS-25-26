```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Y2K Vibes 💿✨</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Verdana', sans-serif;
    background: radial-gradient(circle at top, #ffb6f9, #ffc0cb, #ffe4f0);
    overflow-x: hidden;
    color: #4a044e;
}

/* GLITTER BACKGROUND */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background-image: url("https://www.transparenttextures.com/patterns/stardust.png");
    opacity: 0.4;
    z-index: -1;
}

/* HEADER */
header {
    text-align: center;
    padding: 40px;
    background: linear-gradient(135deg, #ff66cc, #ff99ff);
    color: white;
    text-shadow: 0 0 10px white;
    box-shadow: 0 0 25px rgba(255, 105, 180, 0.6);
}

header h1 {
    font-size: 2.5rem;
    letter-spacing: 2px;
}

/* MAIN CARD */
.container {
    max-width: 900px;
    margin: 40px auto;
    background: linear-gradient(135deg, #ffffff, #ffe4f0);
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 0 30px rgba(255, 105, 180, 0.3);
    border: 2px solid #ffb6f9;
    text-align: center;
}

/* BUTTON */
button {
    margin-top: 20px;
    padding: 15px 25px;
    font-size: 1rem;
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, #ff66cc, #ff1493);
    color: white;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
}

button:hover {
    transform: scale(1.1) rotate(-2deg);
    box-shadow: 0 0 25px rgba(255, 20, 147, 1);
}

/* FLOATING EMOJIS */
.emoji {
    position: fixed;
    font-size: 24px;
    animation: floatUp 5s linear infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(100vh) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
    }
}

/* TEXT BOX */
.output {
    margin-top: 20px;
    padding: 20px;
    background: #fff;
    border-radius: 15px;
    border: 2px dashed #ff99cc;
    min-height: 60px;
    font-size: 1.2rem;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    font-size: 0.9rem;
    color: #9d174d;
}
</style>
</head>

<body>

<header>
    <h1>💿 Y2K DREAM ✨</h1>
    <p>Bienvenido a la estética dosmilera 💖</p>
</header>

<div class="container">
    <h2>Haz clic para vibes ✨</h2>
    <button onclick="generarMensaje()">Click me 💅</button>

    <div class="output" id="output">
        ...
    </div>
</div>

<footer>
    Made with 💖 Y2K energy
</footer>

<script>
const mensajes = [
    "✨ Eres icónicx ✨",
    "💖 Brillas más que el glitter 💖",
    "🌈 Y2K never died 🌈",
    "💿 Estética 2000 activada 💿",
    "✨ Slay siempre ✨"
];

function generarMensaje() {
    const random = mensajes[Math.floor(Math.random() * mensajes.length)];
    document.getElementById("output").innerText = random;

    crearEmoji();
}

function crearEmoji() {
    const emojis = ["💖", "✨", "🌈", "💿", "⭐"];
    const emoji = document.createElement("div");

    emoji.classList.add("emoji");
    emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];

    emoji.style.left = Math.random() * 100 + "vw";

    document.body.appendChild(emoji);

    setTimeout(() => {
        emoji.remove();
    }, 5000);
}
</script>

</body>
</html>
